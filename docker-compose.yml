version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bank_postgres_dwh
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank_dwh
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/00_init_schema.sql:/docker-entrypoint-initdb.d/00_init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank_dwh"]
      interval: 3s
      timeout: 3s
      retries: 5

  pipeline:
    build: .
    container_name: bank_etl_pipeline
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_URL=postgresql+psycopg2://postgres:postgres@db:5432/bank_dwh

volumes:
  pg_data:
    driver: local